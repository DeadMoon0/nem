name: publish

on:
  push:
    tags: ['v*']

# contents: write  - create the GitHub Release
# id-token: write  - NuGet trusted publishing (OIDC identity for NuGet/login)
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the packed commit hash is complete

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Guard against forgetting to bump <Version> before tagging.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qF "<Version>${TAG_VERSION}</Version>" nem/nem.csproj; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match <Version> in nem/nem.csproj"
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # Pack only the tool project; its project reference (nem.Common) is
      # built and bundled into the package, not published as a dependency.
      - name: Pack
        run: dotnet pack nem/nem.csproj -c Release -o artifacts

      # Trusted publishing: no API key in the repo or secrets. The OIDC JWT
      # proves this job ran on tag v* in DeadMoon0/NEM's publish.yml, which
      # must match the trusted publisher registered on nuget.org for the
      # package. 'user' is the nuget.org profile that owns the package.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: DeadMoon0
          keyring: ~/.nuget/keys.keyring
        continue-on-error: false

      # Publish with the key from the login step. If the policy on nuget.org
      # is not (yet) registered, the push is rejected there.
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/nem.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      # Release notes come from the tagged commit message.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes "$(git log -1 --format=%B)" artifacts/nem.*.nupkg
