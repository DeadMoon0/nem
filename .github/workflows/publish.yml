name: publish

on:
  push:
    tags: ['v*']

# contents: write  - create the GitHub Release
# id-token: write  - NuGet trusted publishing (OIDC identity exposed as github.token)
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the packed commit hash is complete

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Guard against forgetting to bump <Version> before tagging.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qF "<Version>${TAG_VERSION}</Version>" nem/nem.csproj; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match <Version> in nem/nem.csproj"
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # Pack only the tool project; its project reference (nem.Common) is
      # built and bundled into the package, not published as a dependency.
      - name: Pack
        run: dotnet pack nem/nem.csproj -c Release -o artifacts

      # Trusted publishing: no API key. The OIDC JWT proves this job ran on
      # tag v* in DeadMoon0/nem's publish.yml, which must match the trusted
      # publisher registered on nuget.org for the package.
      - name: Publish to NuGet
        run: dotnet nuget push artifacts/nem.*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ github.token }}"

      # Release notes come from the tagged commit message.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes "$(git log -1 --format=%B)" artifacts/nem.*.nupkg
